<script>
  // ===================================
  // CONFIGURATION
  // ===================================

  // URL Web App Google Apps Script
  const API_URL = "https://script.google.com/macros/s/AKfycbw-6gs7wHK3Zq15nlQZOBGNHl-cuMRpLlFkV3HhJKaiwFWZ_X-ZPIsmAzl04bJJB_U/exec";

  const CLOUDINARY_CLOUD_NAME = "nnrjmpdv";
  const CLOUDINARY_UPLOAD_PRESET = "ml_default";

  let token = "";
  let dataCache = {
    products: [],
    testimonials: []
  };

  const $ = id => document.getElementById(id);

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c]));
  }

  function toast(message) {
    const toastEl = $("toast");
    if (!toastEl) return;
    toastEl.textContent = message;
    toastEl.classList.remove("hidden");

    setTimeout(() => {
      toastEl.classList.add("hidden");
    }, 2800);
  }

  function fail(error) {
    toast(error && error.message ? error.message : String(error));
  }

  // Helper HTTP Request via Fetch API (Support Apps Script Redirect)
  async function apiCall(data) {
    const response = await fetch(API_URL, {
      method: "POST",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });
    
    if (!response.ok) {
      throw new Error("Gagal terhubung ke server (HTTP " + response.status + ")");
    }

    const result = await response.json();
    if (!result.success) {
      throw new Error(result.message || "Terjadi kesalahan.");
    }
    return result;
  }

  // ===================================
  // INITIALIZATION (AMBIL ELEMEN SETELAH DOM READY)
  // ===================================

  document.addEventListener("DOMContentLoaded", function() {
    
    // --- LOGIN FORM ---
    const loginForm = $("loginForm");
    if (loginForm) {
      loginForm.addEventListener("submit", async function(e) {
        e.preventDefault();

        const button = loginForm.querySelector("button");
        const errorEl = $("loginError");

        button.disabled = true;
        if (errorEl) errorEl.textContent = "Memeriksa password...";

        try {
          const authRes = await apiCall({
            action: "verifyAdminPassword",
            password: $("password").value
          });

          token = authRes.token;
          if (errorEl) errorEl.textContent = "Mengambil data dashboard...";

          const dataRes = await apiCall({
            action: "adminGetData",
            token: token
          });

          renderData(dataRes.data);
          $("loginView").classList.add("hidden");
          $("appView").classList.remove("hidden");
          if (errorEl) errorEl.textContent = "";

        } catch (err) {
          token = "";
          if (errorEl) errorEl.textContent = "Login gagal: " + (err.message || String(err));
        } finally {
          button.disabled = false;
        }
      });
    }

    // --- LOGOUT ---
    const logoutBtn = $("logoutBtn");
    if (logoutBtn) {
      logoutBtn.onclick = function() {
        token = "";
        $("appView").classList.add("hidden");
        $("loginView").classList.remove("hidden");
        if ($("password")) $("password").value = "";
      };
    }

    // --- NAVIGATION ---
    document.querySelectorAll("[data-page]").forEach(button => {
      button.onclick = () => showPage(button.dataset.page);
    });

    // --- RESET BUTTONS ---
    if ($("resetProduct")) $("resetProduct").onclick = resetProduct;
    if ($("resetTest")) $("resetTest").onclick = resetTest;

    // --- PRODUCT FORM SUBMIT ---
    const productForm = $("productForm");
    if (productForm) {
      productForm.onsubmit = async function(e) {
        e.preventDefault();
        const button = $("saveProductBtn");
        button.disabled = true;
        button.textContent = "Menyimpan...";

        try {
          let image = $("pGambar").value.trim();
          const fileInput = $("pFile");
          const file = fileInput && fileInput.files ? fileInput.files[0] : null;

          if (file) {
            if (file.size > 5 * 1024 * 1024) throw new Error("Ukuran gambar maksimal 5 MB.");
            if (!file.type.startsWith("image/")) throw new Error("File harus berupa gambar.");
            image = await uploadImage(file);
          }

          const res = await apiCall({
            action: "adminSaveProduct",
            token: token,
            item: {
              id: $("productId").value,
              nama: $("pNama").value,
              deskripsi: $("pDeskripsi").value,
              harga: $("pHarga").value,
              gambar: image,
              kategori: $("pKategori").value
            }
          });

          toast(res.message);
          resetProduct();
          refreshData();
        } catch(error) {
          fail(error);
        } finally {
          button.disabled = false;
          button.textContent = "Simpan Program";
        }
      };
    }

    // --- TESTIMONIAL FORM SUBMIT ---
    const testForm = $("testForm");
    if (testForm) {
      testForm.onsubmit = async function(e) {
        e.preventDefault();
        const button = $("saveTestBtn");
        button.disabled = true;

        try {
          const res = await apiCall({
            action: "adminSaveTestimonial",
            token: token,
            item: {
              id: $("testId").value,
              nama: $("tNama").value,
              pesan: $("tPesan").value,
              rating: $("tRating").value,
              avatar: $("tAvatar").value
            }
          });
          toast(res.message);
          resetTest();
          refreshData();
        } catch (err) {
          fail(err);
        } finally {
          button.disabled = false;
        }
      };
    }
  });

  // ===================================
  // NAVIGATION & UI FUNCTIONS
  // ===================================

  function showPage(page) {
    ["dashboard", "products", "testimonials"].forEach(name => {
      const el = $(name + "Page");
      if (el) el.classList.toggle("hidden", name !== page);
    });

    document.querySelectorAll("[data-page]").forEach(button => {
      button.classList.toggle("active", button.dataset.page === page);
    });

    if ($("pageTitle")) {
      $("pageTitle").textContent =
        page === "products" ? "Webinar & Workshop" :
        page === "testimonials" ? "Testimoni" :
        "Dashboard";
    }
  }

  async function refreshData() {
    if (!token) return;
    try {
      const res = await apiCall({ action: "adminGetData", token });
      renderData(res.data);
    } catch (err) {
      fail(err);
    }
  }

  function renderData(data) {
    dataCache = data;

    if ($("countProducts")) $("countProducts").textContent = data.products.length;
    if ($("countTests")) $("countTests").textContent = data.testimonials.length;

    // TABEL PROGRAM
    if ($("productsBody")) {
      $("productsBody").innerHTML = data.products.length
        ? data.products.map(p => `
          <tr>
            <td>${p.gambar ? `<img class="thumb" src="${esc(p.gambar)}">` : "—"}</td>
            <td>
              <strong>${esc(p.nama)}</strong>
              <br>
              <span class="muted">${esc(p.deskripsi).slice(0,75)}</span>
            </td>
            <td>${esc(p.kategori)}</td>
            <td>${esc(p.harga)}</td>
            <td>
              <div class="actions">
                <button class="btn light" onclick="editProduct('${esc(p.id)}')">Edit</button>
                <button class="btn danger" onclick="deleteProduct('${esc(p.id)}')">Hapus</button>
              </div>
            </td>
          </tr>
        `).join("")
        : '<tr><td colspan="5" class="empty">Belum ada program.</td></tr>';
    }

    // TABEL TESTIMONI
    if ($("testsBody")) {
      $("testsBody").innerHTML = data.testimonials.length
        ? data.testimonials.map(t => `
          <tr>
            <td><strong>${esc(t.nama)}</strong></td>
            <td>${esc(t.pesan).slice(0,100)}</td>
            <td>${"★".repeat(Math.max(1,Math.min(5,Number(t.rating)||5)))}</td>
            <td>
              <div class="actions">
                <button class="btn light" onclick="editTest('${esc(t.id)}')">Edit</button>
                <button class="btn danger" onclick="deleteTest('${esc(t.id)}')">Hapus</button>
              </div>
            </td>
          </tr>
        `).join("")
        : '<tr><td colspan="4" class="empty">Belum ada testimoni.</td></tr>';
    }
  }

  // ===================================
  // CRUD & CLOUDINARY HANDLERS
  // ===================================

  function resetProduct() {
    if ($("productForm")) $("productForm").reset();
    if ($("productId")) $("productId").value = "";
    if ($("productFormTitle")) $("productFormTitle").textContent = "Tambah Program";
  }

  function editProduct(id) {
    const p = dataCache.products.find(x => x.id === id);
    if (!p) return;

    showPage("products");
    $("productId").value = p.id;
    $("pNama").value = p.nama;
    $("pKategori").value = p.kategori;
    $("pHarga").value = p.harga;
    $("pGambar").value = p.gambar;
    $("pDeskripsi").value = p.deskripsi;
    $("productFormTitle").textContent = "Edit Program";
    window.scrollTo({top: 0, behavior: "smooth"});
  }

  async function deleteProduct(id) {
    if (!confirm("Hapus program ini?")) return;
    try {
      const res = await apiCall({ action: "adminDeleteProduct", token, id });
      toast(res.message);
      refreshData();
    } catch (err) {
      fail(err);
    }
  }

  function resetTest() {
    if ($("testForm")) $("testForm").reset();
    if ($("testId")) $("testId").value = "";
    if ($("testFormTitle")) $("testFormTitle").textContent = "Tambah Testimoni";
  }

  function editTest(id) {
    const t = dataCache.testimonials.find(x => x.id === id);
    if (!t) return;

    showPage("testimonials");
    $("testId").value = t.id;
    $("tNama").value = t.nama;
    $("tPesan").value = t.pesan;
    $("tRating").value = t.rating;
    $("tAvatar").value = t.avatar;
    $("testFormTitle").textContent = "Edit Testimoni";
    window.scrollTo({top: 0, behavior: "smooth"});
  }

  async function deleteTest(id) {
    if (!confirm("Hapus testimoni ini?")) return;
    try {
      const res = await apiCall({ action: "adminDeleteTestimonial", token, id });
      toast(res.message);
      refreshData();
    } catch (err) {
      fail(err);
    }
  }

  async function uploadImage(file) {
    if (!file) return "";
    if (CLOUDINARY_CLOUD_NAME.startsWith("GANTI_") || CLOUDINARY_UPLOAD_PRESET.startsWith("GANTI_")) {
      throw new Error("Isi Cloud Name dan Upload Preset Cloudinary terlebih dahulu.");
    }
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

    const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
      method: "POST",
      body: formData
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error?.message || "Upload gambar gagal.");
    return result.secure_url;
  }
</script>
